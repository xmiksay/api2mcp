services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: api2mcp
      POSTGRES_PASSWORD: api2mcp
      POSTGRES_DB: api2mcp
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api2mcp -d api2mcp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
