name: Release

# A SemVer tag vX.Y.Z publishes ghcr.io/<owner>/api2mcp:X.Y.Z — and nothing else: no `latest`,
# no sha tags. Argo CD Image Updater on F13 follows the plain X.Y.Z tags.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        id: meta-version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi
          {
            echo "node=$(sed 's/^v//' .nvmrc)"
            echo "rust=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
            echo "commit=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ steps.meta-version.outputs.node }}
            RUST_VERSION=${{ steps.meta-version.outputs.rust }}
            GIT_COMMIT=${{ steps.meta-version.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
